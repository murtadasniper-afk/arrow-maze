name: Build Parking Escape 3D Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Verify web assets
        run: test -f www/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Parking Escape 3D</string>
              <string name="title_activity_main">Parking Escape 3D</string>
              <string name="package_name">com.arrowmaze.game</string>
              <string name="custom_url_scheme">com.arrowmaze.game</string>
          </resources>
          ''', encoding="utf-8")
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parking-escape-3d-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
