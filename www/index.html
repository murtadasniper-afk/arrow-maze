<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101426">
<title>Arrow Maze - متاهة الأسهم</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #101426;
    --panel: #191f35;
    --panel2: #222a44;
    --green: #48e0a4;
    --blue: #6c8cff;
    --text: #f5f7ff;
    --muted: #9ba6c7;
    --danger: #ff647c;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(ellipse at top, #202b4b 0%, var(--bg) 65%);
    color: var(--text);
    font-family: system-ui, -apple-system, Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 18px 16px 28px;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo-icon {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--green), #20a8a0);
    color: #10251f;
    font-size: 27px;
    font-weight: 900;
    box-shadow: 0 5px 22px #48e0a430;
}

.logo h1 {
    font-size: 19px;
    margin: 0;
    letter-spacing: .2px;
}

.logo p {
    font-size: 11px;
    color: var(--muted);
    margin: 4px 0 0;
}

.sound-btn {
    border: 1px solid #343e5d;
    color: white;
    background: var(--panel);
    border-radius: 13px;
    width: 43px;
    height: 43px;
    font-size: 19px;
}

.hero {
    text-align: center;
    margin: 20px 0;
}

.hero .eyebrow {
    color: var(--green);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
}

.hero h2 {
    font-size: 28px;
    margin: 8px 0;
}

.hero p {
    font-size: 13px;
    line-height: 1.8;
    color: var(--muted);
    margin: 0 auto;
    max-width: 290px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 23px 0 18px;
}

.stat {
    background: linear-gradient(145deg, #202943, #181e32);
    border: 1px solid #303954;
    border-radius: 16px;
    text-align: center;
    padding: 13px 5px;
}

.stat-icon {
    font-size: 19px;
}

.stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
}

.stat-value {
    font-size: 19px;
    font-weight: 850;
    margin-top: 4px;
}

.board-wrap {
    background: #171d30;
    border: 1px solid #303a56;
    border-radius: 22px;
    padding: 12px;
    box-shadow: 0 18px 45px #00000020;
}

.board-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 2px 2px 12px;
    font-size: 12px;
}

.level-badge {
    background: #28364c;
    color: var(--green);
    border-radius: 9px;
    padding: 7px 11px;
    font-weight: 800;
}

.progress-text {
    color: var(--muted);
}

.progress-track {
    height: 5px;
    border-radius: 8px;
    background: #2b334c;
    overflow: hidden;
    margin-bottom: 14px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #30bfa1, var(--green));
    transition: width .3s ease;
}

.board {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 7px;
    width: 100%;
    aspect-ratio: 1;
    direction: ltr;
}

.cell {
    min-width: 0;
    min-height: 0;
    border: 1px solid #2b3550;
    border-radius: 12px;
    background: #202840;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
}

.arrow {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    border: 0;
    background: transparent;
    color: var(--green);
    font-size: clamp(24px, 7vw, 36px);
    font-weight: 900;
    line-height: 1;
    transition: transform .15s, opacity .15s;
}

.arrow:active {
    transform: scale(.82);
}

.arrow.blocked {
    color: var(--danger);
    animation: shake .22s;
}

.arrow.removing {
    animation: vanish .25s forwards;
    pointer-events: none;
}

.cell.empty {
    background: #151b2b;
    border-color: #202940;
}

@keyframes vanish {
    to {
        opacity: 0;
        transform: scale(.3);
    }
}

@keyframes shake {
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
}

.message {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 8px 2px;
}

.message.good {
    color: var(--green);
}

.message.bad {
    color: var(--danger);
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.btn {
    min-height: 48px;
    border: 1px solid #37415e;
    border-radius: 14px;
    color: white;
    background: #252e47;
    font-weight: 750;
    font-size: 13px;
    transition: transform .15s;
}

.btn:active {
    transform: scale(.97);
}

.btn.primary {
    background: linear-gradient(135deg, #48e0a4, #25bba0);
    border: 0;
    color: #10251f;
}

.section-title {
    font-size: 15px;
    font-weight: 800;
    margin: 25px 0 12px;
}

.how-to {
    display: grid;
    gap: 9px;
}

.tip {
    display: flex;
    gap: 12px;
    align-items: center;
    background: #191f33;
    border: 1px solid #2c3550;
    border-radius: 14px;
    padding: 13px;
}

.tip-icon {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border-radius: 12px;
    background: #28364a;
    display: grid;
    place-items: center;
    font-size: 20px;
}

.tip strong {
    font-size: 12px;
    display: block;
    margin-bottom: 4px;
}

.tip p {
    color: var(--muted);
    font-size: 11px;
    margin: 0;
    line-height: 1.7;
}

.footer {
    text-align: center;
    color: #7783a4;
    font-size: 10px;
    padding: 25px 0 0;
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #080c18d9;
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 22px;
}

.overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 340px;
    background: #1b233a;
    border: 1px solid #3b4965;
    border-radius: 24px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 20px 80px #0008;
}

.modal-icon {
    font-size: 54px;
}

.modal h2 {
    margin: 12px 0 8px;
    font-size: 23px;
}

.modal p {
    font-size: 13px;
    line-height: 1.8;
    color: var(--muted);
}

.modal .btn {
    width: 100%;
    margin-top: 9px;
}

@media (max-width: 360px) {
    .app {
        padding: 14px 11px 24px;
    }

    .board {
        gap: 5px;
    }

    .cell {
        border-radius: 9px;
    }

    .hero h2 {
        font-size: 24px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="app">

    <header class="header">
        <div class="logo">
            <div class="logo-icon">➜</div>
            <div>
                <h1>ARROW MAZE</h1>
                <p>متاهة الأسهم الذكية</p>
            </div>
        </div>

        <button class="sound-btn" id="soundBtn"
                aria-label="تبديل الصوت" title="تبديل الصوت">🔊</button>
    </header>

    <section class="hero">
        <div class="eyebrow">◆ تحدَّ ذكاءك ◆</div>
        <h2>هل تستطيع إزالة الجميع؟</h2>
        <p>
            أزل الأسهم من اللوحة واحدًا
