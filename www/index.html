<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07131b">
<title>Parking Escape 3D</title>
<style>
:root{--bg:#07131b;--panel:#12232d;--line:#31505d;--mint:#72ffd0;--cyan:#51ddff;--text:#f5fbff;--muted:#a3bac4;--gold:#ffda78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Arial,sans-serif}
button{font:inherit;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#1c3b49,#07131b 75%)}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}
#home{align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(ellipse at 50% 25%,#1d5663 0%,#102632 45%,#07131b 100%)}
.home-inner{width:min(100%,430px);text-align:center}
.logo-wrap{width:min(78vw,300px);aspect-ratio:1;margin:0 auto 12px;border-radius:32px;overflow:hidden;box-shadow:0 18px 55px #0008,0 0 35px #55f5ce2c;border:1px solid #a8fff066}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.game-name{font-weight:1000;font-size:clamp(27px,7vw,39px);letter-spacing:1px;margin:8px 0}
.game-name span{color:var(--mint)}
.tagline{color:var(--muted);font-size:13px;line-height:1.8;margin:0 auto 22px;max-width:330px}
.home-stats{display:flex;justify-content:center;gap:10px;margin:0 0 20px}
.home-stat{border:1px solid #3b5b66;background:#102630c9;padding:10px 18px;border-radius:15px;min-width:100px}
.home-stat small{display:block;color:var(--muted);font-size:11px}
.home-stat strong{display:block;font-size:22px;margin-top:2px}
.primary{border:0;color:#062129;background:linear-gradient(110deg,#7affd8,#4bd8f0);box-shadow:0 7px 24px #4ce8ca2a;font-weight:950}
.big-btn{width:100%;max-width:340px;min-height:57px;border-radius:17px;font-size:17px}
.secondary{color:var(--text);background:#172d38;border:1px solid #3b5965;font-weight:800}
.home-actions{display:grid;gap:10px;justify-items:center}
.home-actions .secondary{width:100%;max-width:340px;min-height:46px;border-radius:14px}
#game{flex-direction:column;background:#08141b}
.topbar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#07131bee,#07131b99,transparent);pointer-events:none}
.topbar>*{pointer-events:auto}
.small-btn{border:1px solid #496571;background:#10242fdd;color:white;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:800}
.stage-label{font-size:12px;font-weight:900;background:#122c36dd;border:1px solid #42636c;padding:9px 11px;border-radius:12px}
.stage-label span{color:var(--mint)}
.hud{position:absolute;z-index:5;top:calc(61px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;justify-content:center;pointer-events:none}
.hud-item{padding:7px 11px;border:1px solid #36535e;background:#10232cdb;border-radius:12px;font-size:11px;color:var(--muted)}
.hud-item strong{color:white;font-size:13px;margin-inline-start:4px}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bottom-panel{position:absolute;z-index:5;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:center;gap:8px;justify-content:center;pointer-events:none}
.bottom-panel button{pointer-events:auto;min-height:44px;border-radius:13px;padding:8px 13px}
#status{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));text-align:center;font-size:12px;line-height:1.6;color:#c3d6dc;text-shadow:0 2px 4px #000;background:#07131b8c;border-radius:10px;padding:6px 8px;pointer-events:none}
#overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:#02090de0;backdrop-filter:blur(8px)}
#overlay.show{display:flex}
.modal{width:min(100%,340px);padding:24px 19px;text-align:center;border-radius:24px;background:linear-gradient(145deg,#1b3742,#0e1d26);border:1px solid #52717b;box-shadow:0 20px 70px #0009}
.modal .icon{font-size:46px}.modal h2{margin:8px 0;font-size:25px}.modal p{color:var(--muted);font-size:13px;line-height:1.8}.modal button{width:100%;min-height:46px;border-radius:13px;margin-top:8px}
#levelPicker{align-items:center;justify-content:center;padding:20px;background:#07131b}
.picker-inner{width:min(100%,400px);max-height:90%;overflow:auto;background:#11242e;border:1px solid #34535e;border-radius:22px;padding:18px}
.picker-inner h2{margin:0 0 8px}.picker-inner p{color:var(--muted);font-size:12px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}
.level-tile{min-height:48px;border-radius:12px;border:1px solid #3b5964;background:#1b3540;color:white;font-weight:900}
.level-tile.locked{opacity:.3}
@media(max-height:650px){.logo-wrap{width:min(44vh,220px)}.tagline{margin-bottom:12px}.home-stat{padding:7px 14px}.big-btn{min-height:49px}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen active">
    <div class="home-inner">
      <div class="logo-wrap"><img id="brandLogo" alt="Parking Escape 3D logo"></div>
      <h1 class="game-name">PARKING <span>ESCAPE 3D</span></h1>
      <p class="tagline">افتح الطريق، حرّك السيارات بالترتيب الصحيح، واهرب من الموقف المزدحم!</p>
      <div class="home-stats">
        <div class="home-stat"><small>المرحلة</small><strong id="homeLevel">1</strong></div>
        <div class="home-stat"><small>العملات</small><strong id="homeCoins">0</strong></div>
      </div>
      <div class="home-actions">
        <button id="startBtn" class="primary big-btn">▶ ابدأ اللعب</button>
        <button id="levelsBtn" class="secondary">اختيار المرحلة</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen">
    <canvas id="scene"></canvas>
    <div class="topbar">
      <button class="small-btn" id="homeBtn">⌂ القائمة</button>
      <div class="stage-label">المرحلة <span id="stageNumber">1</span></div>
      <button class="small-btn" id="cameraBtn">↺ الكاميرا</button>
    </div>
    <div class="hud">
      <div class="hud-item">🚘 السيارات <strong id="carsLeft">0</strong></div>
      <div class="hud-item">🪙 العملات <strong id="gameCoins">0</strong></div>
    </div>
    <div id="status">انقر على سيارة طريقها مفتوح. اسحب على الأرض لتدوير الكاميرا قليلًا.</div>
    <div class="bottom-panel">
      <button class="secondary" id="restartBtn">↻ إعادة المرحلة</button>
      <button class="primary" id="hintBtn">✦ تلميح · 5 🪙</button>
    </div>
  </section>

  <section id="levelPicker" class="screen">
    <div class="picker-inner">
      <h2>اختر المرحلة</h2>
      <p>المراحل المقفلة تُفتح بعد إكمال المراحل السابقة.</p>
      <div class="levels" id="levelsGrid"></div>
      <button class="secondary" id="closeLevels" style="width:100%;min-height:44px;border-radius:12px">رجوع</button>
    </div>
  </section>

  <div id="overlay">
    <div class="modal">
      <div class="icon">🏆</div>
      <h2>أحسنت! هربت من الموقف</h2>
      <p id="winText"></p>
      <button class="primary" id="nextBtn">المرحلة التالية ←</button>
      <button class="secondary" id="retryBtn">إعادة المرحلة</button>
      <button class="secondary" id="winHomeBtn">القائمة الرئيسية</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
const logo=$('brandLogo');
/* شعار اللعبة المدمج داخل الصفحة، مستقل عن ملفات إضافية */
logo.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#06131e"/><stop offset="1" stop-color="#126a75"/></linearGradient><linearGradient id="b" x2="0" y2="1"><stop stop-color="#ff6873"/><stop offset="1" stop-color="#a80d23"/></linearGradient></defs>
<rect width="512" height="512" rx="72" fill="url(#a)"/>
<path d="M35 170H477M35 345H477" stroke="#e8e5b7" stroke-width="7" stroke-dasharray="25 18" opacity=".8"/>
<path d="M256 355V120m-67 67 67-67 67 67" stroke="#63ffd0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g transform="translate(155 230)"><rect x="10" y="0" width="182" height="230" rx="47" fill="#111a20" stroke="#e7f7f5" stroke-width="6"/><path d="M49 16Q101 -1 153 16L166 65H36Z" fill="#a4efff"/><path d="M35 82Q101 68 167 82L160 148Q101 165 42 148Z" fill="url(#b)"/><path d="M42 170Q101 184 160 170L148 206H54Z" fill="#182b36"/><rect x="22" y="23" width="12" height="38" rx="5" fill="#fff6bf"/><rect x="168" y="23" width="12" height="38" rx="5" fill="#fff6bf"/><rect x="22" y="174" width="12" height="22" rx="5" fill="#ff2b46"/><rect x="168" y="174" width="12" height="22" rx="5" fill="#ff2b46"/></g>
</svg>`);

const DIRS={U:{dr:-1,dc:0},R:{dr:0,dc:1},D:{dr:1,dc:0},L:{dr:0,dc:-1}};
const carColors=[0xe83c4d,0x168ee0,0xffc52d,0x43cf9b,0x9a72ef,0xf4f7f8,0xff853b,0xe85bb4];
let level=1,coins=0,unlocked=1,size=5,cars=[],initialCars=[],locked=false;
let renderer,scene,camera,raycaster,groundPlane,carGroup,arrowGroup,roadGroup;
let cameraAzimuth=0,cameraTilt=0.82,baseCameraTilt=0.82,baseCameraAzimuth=0;
let pointerStart=null,dragging=false,dragged=false,lastPointer=null;
let animatingCars=new Set(),lastTime=0,winShown=false;
const cell=2.15, spacing=2.24;
const boardSpan=n=>(n-1)*spacing;
const positions=(r,c,n)=>({x:(c-(n-1)/2)*spacing,z:(r-(n-1)/2)*spacing});

function load(){
  try{level=Math.max(1,+(localStorage.getItem('pe3d_level')||1));coins=Math.max(0,+(localStorage.getItem('pe3d_coins')||0));unlocked=Math.max(level,+(localStorage.getItem('pe3d_unlocked')||1));}catch{}
  syncHome();
}
function save(){try{localStorage.setItem('pe3d_level',level);localStorage.setItem('pe3d_coins',coins);localStorage.setItem('pe3d_unlocked',unlocked)}catch{}}
function syncHome(){$('homeLevel').textContent=level;$('homeCoins').textContent=coins;$('gameCoins').textContent=coins}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function setStatus(t){$('status').textContent=t}
function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function gridSize(l){return l<4?5:l<8?6:l<16?7:8}
function targetCount(n,l){let d=l<4?.56:l<8?.63:l<16?.68:.72;return Math.min(n*n-2,Math.floor(n*n*d))}
function pathClear(grid,n,index,dir){let d=DIRS[dir],r=Math.floor(index/n)+d.dr,c=index%n+d.dc;while(r>=0&&r<n&&c>=0&&c<n){if(grid[r*n+c])return false;r+=d.dr;c+=d.dc}return true}
function generate(n,l){
 const target=targetCount(n,l);
 for(let attempt=0;attempt<100;attempt++){
  let grid=Array(n*n).fill(null),order=shuffle(Array.from({length:n*n},(_,i)=>i)),count=0;
  for(let i of order){if(count>=target)break;for(let d of shuffle(Object.keys(DIRS))){if(pathClear(grid,n,i,d)){grid[i]={dir:d,color:rand(carColors.length),id:Math.random()};count++;break}}}
  if(count>=Math.floor(target*.85))return grid;
 }
 let grid=Array(n*n).fill(null);
 for(let i of shuffle(Array.from({length:n*n},(_,i)=>i))){for(let d of shuffle(Object.keys(DIRS))){if(pathClear(grid,n,i,d)){grid[i]={dir:d,color:rand(carColors.length),id:Math.random()};break}}if(grid.filter(Boolean).length>=Math.floor(target*.7))break}
 return grid;
}
function initThree(){
 renderer=new THREE.WebGLRenderer({canvas:$('scene'),antialias:true,alpha:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));
 renderer.setSize(innerWidth,innerHeight,false);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.12;
 scene=new THREE.Scene();scene.background=new THREE.Color(0x101f25);scene.fog=new THREE.Fog(0x101f25,24,58);
 camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);
 raycaster=new THREE.Raycaster();
 scene.add(new THREE.HemisphereLight(0xc5f4ff,0x27302c,2.05));
 const sun=new THREE.DirectionalLight(0xfff2d6,3.0);sun.position.set(-8,15,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 const fill=new THREE.DirectionalLight(0x49cfff,1.1);fill.position.set(8,7,-8);scene.add(fill);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x182326,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-.16;ground.receiveShadow=true;scene.add(ground);
 carGroup=new THREE.Group();scene.add(carGroup);roadGroup=new THREE.Group();scene.add(roadGroup);arrowGroup=new THREE.Group();scene.add(arrowGroup);
 buildEnvironment();resetCamera();window.addEventListener('resize',onResize);$('scene').addEventListener('pointerdown',onPointerDown);$('scene').addEventListener('pointermove',onPointerMove);$('scene').addEventListener('pointerup',onPointerUp);$('scene').addEventListener('pointercancel',onPointerCancel);
 renderer.setAnimationLoop(animate);
}
function mat(color,roughness=.65,metalness=.04){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
function box(parent,w,h,d,material,x,y,z,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m;
}
function line(parent,x1,z1,x2,z2,color=0xe7e4c6,width=.045,y=.015){
 const len=Math.hypot(x2-x1,z2-z1);const m=new THREE.Mesh(new THREE.BoxGeometry(width,.012,len),mat(color,.8));m.position.set((x1+x2)/2,y,(z1+z2)/2);m.rotation.y=Math.atan2(x2-x1,z2-z1);parent.add(m);return m;
}
function buildEnvironment(){
 while(roadGroup.children.length)roadGroup.remove(roadGroup.children[0]);
 const n=size,span=boardSpan(n),half=span/2+1.25,roadW=3.3;
 const asphaltCanvas=document.createElement('canvas');asphaltCanvas.width=256;asphaltCanvas.height=256;
 const ac=asphaltCanvas.getContext('2d');ac.fillStyle='#343b3c';ac.fillRect(0,0,256,256);
 for(let k=0;k<2600;k++){const v=35+Math.random()*55;ac.fillStyle=`rgba(${v},${v+2},${v+3},${Math.random()*.22})`;ac.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,1+Math.random()*2)}
 const asphaltTex=new THREE.CanvasTexture(asphaltCanvas);asphaltTex.wrapS=asphaltTex.wrapT=THREE.RepeatWrapping;asphaltTex.repeat.set(8,8);asphaltTex.colorSpace=THREE.SRGBColorSpace;
 const asphaltMat=new THREE.MeshStandardMaterial({map:asphaltTex,color:0xffffff,roughness:.96});
 box(roadGroup,span+roadW*2+2,.12,span+roadW*2+2,asphaltMat,0,-.07,0,false);
 box(roadGroup,span+1.2,.08,span+1.2,asphaltMat,0,-.005,0,false);
 // continuous roadway around parking
 box(roadGroup,span+roadW*2+1,.09,roadW,mat(0x242c30,.95),0,.005,-half-roadW/2,false);
 box(roadGroup,span+roadW*2+1,.09,roadW,mat(0x242c30,.95),0,.005,half+roadW/2,false);
 box(roadGroup,roadW,.09,span+1,mat(0x242c30,.95),-half-roadW/2,.005,0,false);
 box(roadGroup,roadW,.09,span+1,mat(0x242c30,.95),half+roadW/2,.005,0,false);
 // road lane dashes
 for(let x=-half-1;x<half+1;x+=1.7){
  box(roadGroup,.72,.018,.055,mat(0xd8d8b0),x,.07,-half-roadW/2,false);
  box(roadGroup,.72,.018,.055,mat(0xd8d8b0),x,.07,half+roadW/2,false);
 }
 for(let z=-half;z<half;z+=1.7){
  box(roadGroup,.055,.018,.72,mat(0xd8d8b0),-half-roadW/2,.07,z,false);
  box(roadGroup,.055,.018,.72,mat(0xd8d8b0),half+roadW/2,.07,z,false);
 }
 // parking space markings, no raised cell grid
 const edge=span/2+spacing*.48;
 for(let r=0;r<n;r++){
  for(let c=0;c<n;c++){
   const p=positions(r,c,n);
   const w=spacing*.91,d=spacing*.91;
   line(roadGroup,p.x-w/2,p.z-d/2,p.x+w/2,p.z-d/2,0xc8d2c8,.025,.06);
   line(roadGroup,p.x-w/2,p.z-d/2,p.x-w/2,p.z+d/2,0xc8d2c8,.025,.06);
   if(c===n-1)line(roadGroup,p.x+w/2,p.z-d/2,p.x+w/2,p.z+d/2,0xc8d2c8,.025,.06);
   if(r===n-1)line(roadGroup,p.x-w/2,p.z+d/2,p.x+w/2,p.z+d/2,0xc8d2c8,.025,.06);
  }
 }
 // landscaped corners and light bollards
 for(const x of [-half-1.0,half+1.0])for(const z of [-half-1.0,half+1.0]){
  box(roadGroup,1.1,.35,1.1,mat(0x1e3c2d),x,.08,z);
  for(let i=0;i<5;i++){
   const leaf=new THREE.Mesh(new THREE.ConeGeometry(.13,.55,5),mat(i%2?0x237849:0x368c50));leaf.position.set(x+(Math.random()-.5)*.65,.48,z+(Math.random()-.5)*.65);leaf.castShadow=true;roadGroup.add(leaf);
  }
  const bollard=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,.65,12),mat(0x5b6b6c));bollard.position.set(x*.87,.32,z*.87);bollard.castShadow=true;roadGroup.add(bollard);
 }
 // exit markings / luminous green direction sign at road top
 const arrowMat=new THREE.MeshStandardMaterial({color:0x58ffb6,emissive:0x19e990,emissiveIntensity:2.4,roughness:.3});
 const exitZ=-half-roadW/2;
 box(roadGroup,1.0,.035,.13,arrowMat,0,.09,exitZ,false);
 const shape=new THREE.Shape();shape.moveTo(0,-.62);shape.lineTo(.55,.08);shape.lineTo(.22,.08);shape.lineTo(.22,.53);shape.lineTo(-.22,.53);shape.lineTo(-.22,.08);shape.lineTo(-.55,.08);shape.closePath();
 const ag=new THREE.Mesh(new THREE.ShapeGeometry(shape),arrowMat);ag.rotation.x=-Math.PI/2;ag.position.set(0,.105,exitZ-.1);roadGroup.add(ag);
}
function makeCar(car,index){
 const g=new THREE.Group();g.userData={index,car};
 const bodyMat=mat(carColors[car.color],.25,.22),dark=mat(0x111a20,.45),glass=mat(0x173544,.18,.25),chrome=mat(0xb8c9ce,.3,.6);
 // car local forward is -Z; length 1.75, width 1.12
 box(g,1.02,.30,1.70,bodyMat,0,.30,0);
 const hood=box(g,.88,.15,.47,bodyMat,0,.48,-.53);
 const trunk=box(g,.88,.12,.32,bodyMat,0,.45,.59);
 // roof/cabin
 const roof=box(g,.78,.25,.76,bodyMat,0,.53,.02);
 box(g,.70,.045,.35,glass,0,.675,-.23,false);
 box(g,.70,.045,.25,glass,0,.675,.30,false);
 // windshield side frame highlight
 box(g,.04,.045,.58,chrome,-.365,.69,.025,false);
 box(g,.04,.045,.58,chrome,.365,.69,.025,false);
 // wheels on both sides
 for(const z of [-.52,.52])for(const x of [-.55,.55]){
  const wheel=new THREE.Mesh(new THREE.BoxGeometry(.18,.30,.36),dark);wheel.position.set(x,.20,z);wheel.castShadow=true;g.add(wheel);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.025,12),chrome);hub.rotation.z=Math.PI/2;hub.position.set(x*1.02,.20,z);g.add(hub);
 }
 // unmistakable front headlights and rear red tail lights
 const head=mat(0xfff3bc,.2,.1);head.emissive.setHex(0xffe38a);head.emissiveIntensity=1.0;
 const tail=mat(0xff233d,.25,.1);tail.emissive.setHex(0xc90020);tail.emissiveIntensity=1.1;
 for(const x of [-.34,.34]){
  box(g,.20,.09,.08,head,x,.42,-.84,false);
  box(g,.20,.08,.075,tail,x,.39,.84,false);
 }
 // front grille and back plate visually reinforce orientation
 box(g,.36,.07,.035,mat(0x172027),0,.31,-.865,false);
 box(g,.26,.045,.035,mat(0xd8e4e5),0,.30,.87,false);
 const p=positions(Math.floor(index/size),index%size,size);g.position.set(p.x,0,p.z);
 const angle={U:0,R:-Math.PI/2,D:Math.PI,L:Math.PI/2}[car.dir];g.rotation.y=angle;
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 g.userData.index=index;g.userData.car=car;g.userData.home={...p};g.userData.moving=false;
 carGroup.add(g);car.mesh=g;return g;
}
function clearGroup(g){while(g.children.length){const c=g.children.pop();if(c.geometry)c.geometry.dispose();if(c.material){if(Array.isArray(c.material))c.material.forEach(m=>m.dispose());else c.material.dispose()}}}
function rebuildCars(){
 while(carGroup.children.length){const c=carGroup.children[0];carGroup.remove(c);c.traverse(o=>{if(o.isMesh){o.geometry.dispose();if(o.material)o.material.dispose()}})}
 cars.forEach((car,i)=>{if(car)makeCar(car,i)});
 buildHintArrow();updateHUD();
}
function buildHintArrow(){
 while(arrowGroup.children.length){const c=arrowGroup.children[0];arrowGroup.remove(c);if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose()}
 const i=cars.findIndex((c,idx)=>c&&!c.moving&&pathClear(cars,size,idx,c.dir));
 if(i<0)return;
 const car=cars[i],r=Math.floor(i/size),c=i%size,p=positions(r,c,size),d=DIRS[car.dir];
 const material=new THREE.MeshStandardMaterial({color:0x52ffb0,emissive:0x00ff92,emissiveIntensity:2.8,transparent:true,opacity:.92,side:THREE.DoubleSide});
 const shape=new THREE.Shape();shape.moveTo(0,-.42);shape.lineTo(.31,0);shape.lineTo(.12,0);shape.lineTo(.12,.38);shape.lineTo(-.12,.38);shape.lineTo(-.12,0);shape.lineTo(-.31,0);shape.closePath();
 const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape),material);mesh.rotation.x=-Math.PI/2;
 mesh.position.set(p.x+d.dc*.88,.105,p.z+d.dr*.88);
 const yaw={U:0,R:-Math.PI/2,D:Math.PI,L:Math.PI/2}[car.dir];mesh.rotation.z=0;mesh.rotation.y=yaw;
 // flat arrow is oriented toward the car's exit direction
 arrowGroup.add(mesh);
}
function updateHUD(){$('carsLeft').textContent=cars.filter(Boolean).length;$('gameCoins').textContent=coins;$('homeCoins').textContent=coins;$('homeLevel').textContent=level;$('stageNumber').textContent=level}
function startLevel(){
 $('overlay').classList.remove('show');size=gridSize(level);cars=generate(size,level);initialCars=cars.map(c=>c?{...c}:null);locked=false;winShown=false;cameraAzimuth=0;cameraTilt=baseCameraTilt;
 buildEnvironment();rebuildCars();resetCamera();showScreen('game');
 setStatus('انقر على سيارة يمكنها الخروج. اسحب على الأرض لتغيير زاوية الكاميرا.');
}
function resetCamera(){if(!camera)return;cameraAzimuth=0;cameraTilt=baseCameraTilt;updateCamera()}
function updateCamera(){
 if(!camera)return;
 const span=boardSpan(size)+5;
 const radius=span*1.05+9;
 const tilt=Math.max(.55,Math.min(1.08,cameraTilt));
 const target=new THREE.Vector3(0,0,0);
 camera.position.set(Math.sin(cameraAzimuth)*radius*Math.cos(tilt),radius*Math.sin(tilt),Math.cos(cameraAzimuth)*radius*Math.cos(tilt));
 camera.lookAt(target);
 camera.fov=level>12?47:43;camera.updateProjectionMatrix();
}
function onResize(){if(!renderer||!camera)return;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
function screenToNDC(e){const rect=$('scene').getBoundingClientRect();return new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height*2-1))}
function onPointerDown(e){
 if(!$('game').classList.contains('active')||locked)return;
 pointerStart={x:e.clientX,y:e.clientY,id:e.pointerId};lastPointer={x:e.clientX,y:e.clientY};dragged=false;
 $('scene').setPointerCapture?.(e.pointerId);
}
function onPointerMove(e){
 if(!pointerStart||pointerStart.id!==e.pointerId)return;
 const dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;
 if(Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>7)dragged=true;
 if(dragged){
  cameraAzimuth-=dx*.006;
  cameraTilt=Math.max(.58,Math.min(1.05,cameraTilt+dy*.004));
  updateCamera();
 }
 lastPointer={x:e.clientX,y:e.clientY};
}
function onPointerUp(e){
 if(!pointerStart||pointerStart.id!==e.pointerId)return;
 const wasDrag=dragged;pointerStart=null;lastPointer=null;
 if(wasDrag)return;
 const ndc=screenToNDC(e);raycaster.setFromCamera(ndc,camera);
 const meshes=[];carGroup.children.forEach(g=>g.traverse(o=>{if(o.isMesh)meshes.push(o)}));
 const hits=raycaster.intersectObjects(meshes,false);
 if(!hits.length)return;
 let obj=hits[0].object;while(obj.parent&&obj.parent!==carGroup)obj=obj.parent;
 const i=obj.userData.index;if(Number.isInteger(i))tryDrive(i);
}
function onPointerCancel(){pointerStart=null;lastPointer=null}
function tryDrive(i){
 if(locked||!cars[i])return;
 if(!pathClear(cars,size,i,cars[i].dir)){setStatus('🚧 الطريق مسدود! أخرج السيارة التي تعترض مسارها أولًا.');return}
 driveCar(i);
}
function driveCar(i){
 const car=cars[i],mesh=car&&car.mesh;
 if(!mesh||locked)return;
 locked=true;car.moving=true;
 const d=DIRS[car.dir],from=mesh.position.clone();
 const half=boardSpan(size)/2;
 const edge=half+spacing*.52;
 const lane=half+3.0;
 // كل سيارة تصل إلى الطريق المحيط بالموقف ثم تنعطف وتسير عليه قبل مغادرة المشهد.
 let pts=[from.clone()];
 if(car.dir==='U'){
  pts.push(new THREE.Vector3(from.x,0,-edge));
  pts.push(new THREE.Vector3(from.x,0,-lane));
  pts.push(new THREE.Vector3(from.x+.15,0,-lane-.45));
  pts.push(new THREE.Vector3(from.x+.65,0,-lane-.75));
  pts.push(new THREE.Vector3(from.x+2.0,0,-lane-.75));
  pts.push(new THREE.Vector3(from.x+5.8,0,-lane-.75));
 }else if(car.dir==='D'){
  pts.push(new THREE.Vector3(from.x,0,edge));
  pts.push(new THREE.Vector3(from.x,0,lane));
  pts.push(new THREE.Vector3(from.x-.15,0,lane+.45));
  pts.push(new THREE.Vector3(from.x-.65,0,lane+.75));
  pts.push(new THREE.Vector3(from.x-2.0,0,lane+.75));
  pts.push(new THREE.Vector3(from.x-5.8,0,lane+.75));
 }else if(car.dir==='R'){
  pts.push(new THREE.Vector3(edge,0,from.z));
  pts.push(new THREE.Vector3(lane,0,from.z));
  pts.push(new THREE.Vector3(lane+.45,0,from.z-.15));
  pts.push(new THREE.Vector3(lane+.75,0,from.z-.65));
  pts.push(new THREE.Vector3(lane+.75,0,from.z-2.0));
  pts.push(new THREE.Vector3(lane+.75,0,from.z-5.8));
 }else{
  pts.push(new THREE.Vector3(-edge,0,from.z));
  pts.push(new THREE.Vector3(-lane,0,from.z));
  pts.push(new THREE.Vector3(-lane-.45,0,from.z+.15));
  pts.push(new THREE.Vector3(-lane-.75,0,from.z+.65));
  pts.push(new THREE.Vector3(-lane-.75,0,from.z+2.0));
  pts.push(new THREE.Vector3(-lane-.75,0,from.z+5.8));
 }
 const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');
 const length=curve.getLength();
 cars[i]=null;updateHUD();buildHintArrow();
 animatingCars.add({mesh,curve,length,duration:Math.max(2.6,length/3.7),t:0});
 setStatus('🚘 السيارة تخرج من الموقف، تنعطف إلى الشارع وتواصل السير…');
}
function animate(dt){
 if(!renderer||!scene)return;
 const delta=Math.min(dt||.016,.05);lastTime+=delta;
 for(const a of [...animatingCars]){
  a.t+=delta;
  const p=Math.min(1,a.t/a.duration);
  const ease=p*p*(3-2*p);
  const u=Math.min(.9999,ease);
  const pos=a.curve.getPointAt(u);
  const tangent=a.curve.getTangentAt(u).normalize();
  a.mesh.position.copy(pos);
  // تدوير مقدمة السيارة باتجاه المسار، بما في ذلك الانعطاف على الشارع
  a.mesh.rotation.y=Math.atan2(-tangent.x,-tangent.z);
  if(p>=1){
   carGroup.remove(a.mesh);
   a.mesh.traverse(o=>{if(o.isMesh){o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}}});
   animatingCars.delete(a);
   if(cars.every(c=>!c)&&animatingCars.size===0)winLevel();
   else{locked=false;setStatus('اختر سيارة أخرى طريقها مفتوح.');}
  }
 }
 if(arrowGroup.children[0])arrowGroup.children[0].material.opacity=.72+Math.sin(lastTime*4)*.22;
 renderer.render(scene,camera);
}
function winLevel(){
 winShown=true;locked=true;const reward=12+level*3;coins+=reward;unlocked=Math.max(unlocked,level+1);save();updateHUD();
 $('winText').textContent=`أكملت المرحلة ${level} وحصلت على ${reward} عملة.`;
 $('overlay').classList.add('show');
}
function restartLevel(){if(locked&&animatingCars.size)return;cars=initialCars.map(c=>c?{...c,mesh:null}:null);locked=false;winShown=false;animatingCars.clear();buildEnvironment();rebuildCars();resetCamera();setStatus('أعيدت المرحلة. خطط لحركاتك من جديد.')}
function hint(){
 if(locked)return;
 if(coins<5){setStatus('تحتاج إلى 5 عملات للحصول على تلميح.');return}
 const i=cars.findIndex((c,idx)=>c&&pathClear(cars,size,idx,c.dir));
 if(i<0){setStatus('لا توجد سيارة متاحة للخروج الآن.');return}
 coins-=5;save();updateHUD();buildHintArrow();setStatus('💡 السهم الأخضر يوضح اتجاه سيارة يمكنها الخروج الآن.');
}
function openLevels(){
 const grid=$('levelsGrid');grid.innerHTML='';
 for(let i=1;i<=Math.min(40,unlocked+4);i++){
  const b=document.createElement('button');b.className='level-tile'+(i>unlocked?' locked':'');b.textContent=i>unlocked?'🔒':i;
  b.disabled=i>unlocked;b.addEventListener('click',()=>{level=i;save();syncHome();startLevel()});grid.appendChild(b);
 }
 showScreen('levelPicker');
}
$('startBtn').addEventListener('click',()=>startLevel());
$('levelsBtn').addEventListener('click',openLevels);
$('closeLevels').addEventListener('click',()=>showScreen('home'));
$('homeBtn').addEventListener('click',()=>{if(!locked){showScreen('home');syncHome()}});
$('cameraBtn').addEventListener('click',()=>{resetCamera();setStatus('عادت الكاميرا إلى زاويتها الأصلية.')});
$('restartBtn').addEventListener('click',restartLevel);
$('hintBtn').addEventListener('click',hint);
$('nextBtn').addEventListener('click',()=>{level++;save();syncHome();startLevel()});
$('retryBtn').addEventListener('click',()=>{$('overlay').classList.remove('show');restartLevel()});
$('winHomeBtn').addEventListener('click',()=>{$('overlay').classList.remove('show');locked=false;showScreen('home');syncHome()});
load();
initThree();
</script>
</body>
</html>
